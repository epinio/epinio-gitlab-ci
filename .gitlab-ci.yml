stages:
  - validate
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:templates:
  stage: validate
  image: alpine:3.21
  script:
    - apk add --no-cache python3 py3-yaml
    - |
      python3 - <<'PY'
      import pathlib
      import sys
      import yaml

      path = pathlib.Path("templates/deploy.yml")
      docs = list(yaml.safe_load_all(path.read_text()))
      if len(docs) < 2:
          sys.exit("templates/deploy.yml must have spec header and job body")
      header, body = docs[0], docs[1]
      inputs = ((header or {}).get("spec") or {}).get("inputs") or {}
      required = {
          "app_name",
          "namespace",
          "source_path",
          "git_ref",
          "epinio_url",
          "image_tag",
          "epinio_version",
      }
      missing = required - set(inputs)
      if missing:
          sys.exit(f"missing inputs: {sorted(missing)}")
      for name, conf in inputs.items():
          if "description" not in conf:
              sys.exit(f"input {name} missing description")
          if "default" not in conf:
              sys.exit(f"input {name} missing default")
      if "deploy-epinio" not in (body or {}):
          sys.exit("deploy-epinio job missing")
      print("templates/deploy.yml OK")

      raw = pathlib.Path("examples/raw-job.gitlab-ci.yml").read_text().replace("\r\n", "\n")
      readme = pathlib.Path("README.md").read_text().replace("\r\n", "\n")
      fence = "```yaml\n" + raw.rstrip() + "\n```"
      if fence not in readme:
          sys.exit("README.md must reproduce examples/raw-job.gitlab-ci.yml verbatim")
      print("raw job snippet matches README")
      PY

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.122.0
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG of the Epinio GitLab CI/CD component"
