spec:
  inputs:
    app_name:
      description: Epinio application name. Defaults to the GitLab project name.
      default: "$CI_PROJECT_NAME"
    namespace:
      description: Epinio namespace to target before deploy.
      default: "workspace"
    source_path:
      description: >
        Path to application sources for a path-based push.
        Ignored when git_ref or image_tag is set.
      default: "."
    git_ref:
      description: >
        Git branch, tag, or SHA. When set, pushes from this project's
        repository URL at the given revision instead of source_path.
      default: ""
    epinio_url:
      description: >
        Epinio API URL (for example https://epinio.example.com).
        Defaults to the EPINIO_URL CI/CD variable.
      default: "$EPINIO_URL"
    image_tag:
      description: >
        Container image reference including tag (registry/name:tag).
        When set, deploys that image with no source build.
      default: ""
---

# Requires CI/CD variables: EPINIO_URL (or epinio_url input), and either
# EPINIO_TOKEN or EPINIO_USER + EPINIO_PASSWORD.
# Optional: EPINIO_TRUST_CA=true for self-signed API certificates.
# Parent pipeline must include a `deploy` stage (or override this job's stage).
deploy-epinio:
  stage: deploy
  image: alpine:3.21
  variables:
    EPINIO_APP_NAME: "$[[ inputs.app_name ]]"
    EPINIO_NAMESPACE: "$[[ inputs.namespace ]]"
    EPINIO_SOURCE_PATH: "$[[ inputs.source_path ]]"
    EPINIO_GIT_REF: "$[[ inputs.git_ref ]]"
    EPINIO_API_URL: "$[[ inputs.epinio_url ]]"
    EPINIO_IMAGE_TAG: "$[[ inputs.image_tag ]]"
  before_script:
    - apk add --no-cache ca-certificates curl
    - |
      set -eu
      ARCH="$(uname -m)"
      case "$ARCH" in
        x86_64|amd64) ARCH=x86_64 ;;
        aarch64|arm64) ARCH=arm64 ;;
        armv7l) ARCH=armv7 ;;
        *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      VERSION="$(curl -fsSL https://api.github.com/repos/epinio/epinio/releases/latest | sed -n 's/.*"tag_name": "\(v[^"]*\)".*/\1/p' | head -n1)"
      test -n "$VERSION"
      curl -fsSL -o /usr/local/bin/epinio \
        "https://github.com/epinio/epinio/releases/download/${VERSION}/epinio-linux-${ARCH}"
      chmod +x /usr/local/bin/epinio
      epinio --version
  script:
    - |
      set -eu
      URL="${EPINIO_API_URL:-${EPINIO_URL:-}}"
      if [ -z "$URL" ]; then
        echo "epinio_url input or EPINIO_URL variable is required"
        exit 1
      fi

      if [ -n "${EPINIO_TOKEN:-}" ]; then
        mkdir -p "${HOME}/.config/epinio"
        API="${URL%/}"
        case "$API" in
          https://*) WSS="wss://${API#https://}" ;;
          http://*) WSS="ws://${API#http://}" ;;
          *) WSS="$API" ;;
        esac
        printf '%s\n' \
          "api: \"${API}\"" \
          "wss: \"${WSS}\"" \
          'user: ""' \
          'pass: ""' \
          "colors: true" \
          "namespace: \"${EPINIO_NAMESPACE}\"" \
          "token:" \
          "  accesstoken: \"${EPINIO_TOKEN}\"" \
          > "${HOME}/.config/epinio/settings.yaml"
      elif [ -n "${EPINIO_USER:-}" ] && [ -n "${EPINIO_PASSWORD:-}" ]; then
        if [ "${EPINIO_TRUST_CA:-}" = "true" ]; then
          epinio login "$URL" --user "$EPINIO_USER" --password "$EPINIO_PASSWORD" --trust-ca
        else
          epinio login "$URL" --user "$EPINIO_USER" --password "$EPINIO_PASSWORD"
        fi
        epinio target "${EPINIO_NAMESPACE}"
      else
        echo "Set EPINIO_TOKEN, or EPINIO_USER and EPINIO_PASSWORD"
        exit 1
      fi

      if [ -n "${EPINIO_IMAGE_TAG}" ]; then
        epinio push --name "${EPINIO_APP_NAME}" --container-image-url "${EPINIO_IMAGE_TAG}"
      elif [ -n "${EPINIO_GIT_REF}" ]; then
        epinio push --name "${EPINIO_APP_NAME}" --git "${CI_PROJECT_URL}.git,${EPINIO_GIT_REF}"
      else
        epinio push --name "${EPINIO_APP_NAME}" --path "${EPINIO_SOURCE_PATH}"
      fi
